# Fork-only verification; this workflow is not part of the upstream PR.
name: verify-joinscan
on:
  push:
    branches: ["verify/joinscan-system-columns"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  regress:
    name: System columns on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 18]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      PGVER: ${{ matrix.pg }}
    steps:
      - name: Free runner disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / /mnt
          free -h
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends lsof build-essential clang lld flex bison pkg-config ca-certificates git \
            libreadline-dev zlib1g-dev libssl-dev libkrb5-dev liblz4-dev libzstd-dev libcurl4-openssl-dev libopenblas-dev libicu-dev
      - name: Pinned Rust and cargo-pgrx
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo install cargo-pgrx --version 0.19.3 --debug --locked
      - name: Format check
        run: cargo fmt --all -- --check
      - name: PostgreSQL assertion build and pgvector
        run: |
          cargo pgrx init "--pg${PGVER}=download" --configure-flag=--without-readline
          configs=("$HOME"/.pgrx/"${PGVER}".*/pgrx-install/bin/pg_config)
          echo "PG_CONFIG=${configs[0]}" >> "$GITHUB_ENV"
          echo "$(dirname "${configs[0]}")" >> "$GITHUB_PATH"
          git clone -q --depth 1 --branch v0.8.6 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector -j2 PG_CONFIG="${configs[0]}"
          make -C /tmp/pgvector install PG_CONFIG="${configs[0]}"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: joinscan-6630
          shared-key: pg${{ matrix.pg }}
          cache-all-crates: true
          cache-on-failure: true
      - name: Build the upstream baseline without the fix
        run: |
          for source in pg_search/src/postgres/customscan/joinscan/build.rs pg_search/src/postgres/customscan/joinscan/mod.rs; do
            git show fa7c743237bafd2e5fa96f19ea311bc98be384a4:"$source" > "$source"
          done
          git diff --stat
          cd pg_search
          cargo pgrx install --pg-config "$PG_CONFIG" --no-default-features --features "pg${PGVER}"
      - name: The regression must fail on the baseline
        run: |
          echo "shared_preload_libraries = 'pg_search'" >> "$HOME/.pgrx/data-${PGVER}/postgresql.conf"
          (cd pg_search && cargo pgrx start "pg${PGVER}")
          createdb -h localhost -p "288${PGVER}" joinscan_verify
          psql -X -h localhost -p "288${PGVER}" -d joinscan_verify -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_search CASCADE;'
          if psql -X -h localhost -p "288${PGVER}" -d joinscan_verify -v ON_ERROR_STOP=1 -f pg_search/tests/pg_regress/sql/join_system_columns.sql > without-fix.log 2>&1; then
            cat without-fix.log
            echo '::error::The regression passed without the fix'
            exit 1
          fi
          cat without-fix.log
          grep -F 'JoinScan system columns differ:' without-fix.log
      - name: Restore and build the fix
        run: |
          (cd pg_search && cargo pgrx stop "pg${PGVER}")
          git checkout HEAD -- pg_search/src/postgres/customscan/joinscan/build.rs pg_search/src/postgres/customscan/joinscan/mod.rs
          cd pg_search
          cargo pgrx install --pg-config "$PG_CONFIG" --no-default-features --features "pg${PGVER}"
      - name: The exact queries must pass with the fix
        run: |
          (cd pg_search && cargo pgrx start "pg${PGVER}")
          dropdb -h localhost -p "288${PGVER}" joinscan_verify
          createdb -h localhost -p "288${PGVER}" joinscan_verify
          psql -X -h localhost -p "288${PGVER}" -d joinscan_verify -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_search CASCADE;'
          psql -X -h localhost -p "288${PGVER}" -d joinscan_verify -v ON_ERROR_STOP=1 -f pg_search/tests/pg_regress/sql/join_system_columns.sql 2>&1 | tee with-fix.log
      - name: Generate and check pg_regress output
        run: |
          cargo pgrx regress --package pg_search --add join_system_columns "pg${PGVER}" 2>&1 | tee regress.log
          cargo pgrx regress --package pg_search "pg${PGVER}" join_system_columns join_hot_update_vacuum 2>&1 | tee -a regress.log
          git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joinscan-pg${{ matrix.pg }}
          path: |
            without-fix.log
            with-fix.log
            regress.log
            pg_search/tests/pg_regress/expected/join_system_columns.out
            pg_search/tests/pg_regress/results/join_system_columns.out
            pg_search/tests/pg_regress/regression.diffs
            ~/.pgrx/${{ matrix.pg }}.log
