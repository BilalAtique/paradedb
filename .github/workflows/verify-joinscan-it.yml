# Fork-only verification; this workflow is not part of the upstream PR.
name: verify-joinscan-it
on:
  push:
    branches: ["verify/joinscan-system-columns-it"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: System columns on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 18]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      PGVER: ${{ matrix.pg }}
      BASELINE: fa7c743237bafd2e5fa96f19ea311bc98be384a4
      FIXED_SOURCES: pg_search/src/postgres/customscan/joinscan/build.rs pg_search/src/postgres/customscan/joinscan/mod.rs
      EXPECTED: pg_search/tests/pg_regress/expected/join_system_columns.out
      # true: pg_regress writes a new expected file. false: the committed file is checked.
      REGENERATE: "true"
    steps:
      - name: Free runner disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / /mnt
          free -h
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends lsof build-essential clang lld flex bison pkg-config ca-certificates git \
            libreadline-dev zlib1g-dev libssl-dev libkrb5-dev liblz4-dev libzstd-dev libcurl4-openssl-dev libopenblas-dev libicu-dev
      - name: Pinned Rust and cargo-pgrx
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo install cargo-pgrx --version 0.19.3 --debug --locked
      - name: Format check
        run: cargo fmt --all -- --check
      - name: PostgreSQL assertion build and pgvector
        run: |
          cargo pgrx init "--pg${PGVER}=download" --configure-flag=--without-readline
          configs=("$HOME"/.pgrx/"${PGVER}".*/pgrx-install/bin/pg_config)
          echo "PG_CONFIG=${configs[0]}" >> "$GITHUB_ENV"
          echo "$(dirname "${configs[0]}")" >> "$GITHUB_PATH"
          git clone -q --depth 1 --branch v0.8.6 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector -j2 PG_CONFIG="${configs[0]}"
          make -C /tmp/pgvector install PG_CONFIG="${configs[0]}"
          echo "shared_preload_libraries = 'pg_search'" >> "$HOME/.pgrx/data-${PGVER}/postgresql.conf"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: joinscan-6630
          shared-key: pg${{ matrix.pg }}
          cache-all-crates: true
          cache-on-failure: true
      - name: Drop the stale expected output
        if: env.REGENERATE == 'true'
        run: rm -f "$EXPECTED"
      - name: Build the upstream baseline without the fix
        run: |
          for source in $FIXED_SOURCES; do
            git show "$BASELINE":"$source" > "$source"
          done
          git diff --stat
          cd pg_search
          cargo pgrx install --pg-config "$PG_CONFIG" --no-default-features --features "pg${PGVER}"
      - name: The integration test must fail on the baseline
        run: |
          (cd pg_search && cargo pgrx start "pg${PGVER}")
          createdb -h localhost -p "288${PGVER}" pg_search
          set +e
          DATABASE_URL="postgresql://$(whoami)@localhost:288${PGVER}/pg_search" RUST_BACKTRACE=1 \
            cargo test --package tests --test joinscan_system_columns 2>&1 | tee without-fix-integration.log
          status=${PIPESTATUS[0]}
          set -e
          grep -E '^test |^test result:' without-fix-integration.log
          if [[ $status -eq 0 ]]; then
            echo '::error::The integration test passed without the fix'
            exit 1
          fi
          grep -F 'test result: FAILED. 0 passed; 5 failed' without-fix-integration.log
      - name: The regression must fail on the baseline
        if: env.REGENERATE != 'true'
        run: |
          if cargo pgrx regress --package pg_search "pg${PGVER}" join_system_columns > without-fix-regress.log 2>&1; then
            cat without-fix-regress.log
            echo '::error::The regression passed without the fix'
            exit 1
          fi
          cat without-fix-regress.log
          cat pg_search/tests/pg_regress/regression.diffs
          cp pg_search/tests/pg_regress/regression.diffs without-fix-regression.diffs
      - name: Restore and build the fix
        run: |
          (cd pg_search && cargo pgrx stop "pg${PGVER}")
          git checkout HEAD -- $FIXED_SOURCES
          git status --short
          cd pg_search
          cargo pgrx install --pg-config "$PG_CONFIG" --no-default-features --features "pg${PGVER}"
      - name: The integration test must pass with the fix
        run: |
          (cd pg_search && cargo pgrx start "pg${PGVER}")
          DATABASE_URL="postgresql://$(whoami)@localhost:288${PGVER}/pg_search" RUST_BACKTRACE=1 \
            cargo test --package tests --test joinscan_system_columns 2>&1 | tee with-fix-integration.log
          grep -F 'test result: ok. 5 passed; 0 failed' with-fix-integration.log
      - name: pg_regress with the fix
        run: |
          if [[ "$REGENERATE" == "true" ]]; then
            cargo pgrx regress --package pg_search --add join_system_columns "pg${PGVER}" 2>&1 | tee regress.log
          fi
          cargo pgrx regress --package pg_search "pg${PGVER}" join_system_columns 2>&1 | tee -a regress.log
          cargo pgrx regress --package pg_search "pg${PGVER}" join_hot_update_vacuum 2>&1 | tee -a regress.log
          git status --short
          cat "$EXPECTED"
      - name: Clippy on the integration test
        run: cargo clippy --package tests --test joinscan_system_columns -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joinscan-it-pg${{ matrix.pg }}
          path: |
            without-fix-integration.log
            without-fix-regress.log
            without-fix-regression.diffs
            with-fix-integration.log
            regress.log
            pg_search/tests/pg_regress/expected/join_system_columns.out
            pg_search/tests/pg_regress/results/join_system_columns.out
            pg_search/tests/pg_regress/regression.diffs
            ~/.pgrx/${{ matrix.pg }}.log
